title: Executable/script written to Startup folder
id: e2fd1b0e-9740-5de6-a75a-79cf02366945
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\Start Menu\Programs\Startup'
    # 2026-09-02b redteam F5: Startup items are ShellExecute'd at logon, so
    # every script/handler extension outside the old exe|ps1|bat|cmd|vbs|js|lnk
    # list persisted silently: .hta (mshta), .jse/.vbe/.wsf (wscript), .scr
    # (scrfile association; association-dependent, kept anyway — quiet either
    # way is the wrong outcome for a Startup-folder write of that type).
    TargetFilename|re: '(?i)\.(exe|ps1|bat|cmd|vbs|js|jse|vbe|wsf|hta|scr|lnk)$'
  condition: selection
level: high
tags: [attack.persistence, attack.t1547.001]
x-sentinel:
  id: PERSIST-004
  severity: critical
  alert: [popup, toast, log, eventlog]
