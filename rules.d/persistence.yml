# Sentinel catalog — Persistence rules (03-RULES.md §A)
# How malware survives reboot / login.

title: Scheduled task with bypass/headless from user-writable path
id: 2cd63037-0db9-5c16-a54d-b365c535e26a
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection_launch:
    EventID: 1
    Image|endswith: ['\schtasks.exe', '\powershell.exe', '\pwsh.exe', '\conhost.exe', '\cmd.exe']
    CommandLine|contains: ['/create', '-ExecutionPolicy Bypass', '--headless', '-Enc']
  selection_path:
    CommandLine|contains: ['ProgramData', 'AppData', '\Temp\', '\Users\Public\']
  condition: selection_launch and selection_path
level: high
tags: [attack.persistence, attack.t1053.005]
falsepositives: [legitimate installers running from temp]
x-sentinel:
  id: PERSIST-001
  severity: critical
  alert: [popup, toast, log, eventlog]
  # dev_scripts is deliberately NOT used here: PERSIST-001 catches scheduled-
  # task persistence launched from user-writable paths, and install.ps1 /
  # uninstall.ps1 are generic, high-prevalence dropper names. Anchoring
  # dev_scripts here would suppress the exact alert this rule exists to raise
  # (see the incident in the note below). EXEC-001 alone carries the dev-script
  # exception, where the operator's own repo launch is the only realistic hit.
  except: { image_in_allowlist: trusted_binaries }
  note: "XblGameCachesTask used 'conhost.exe --headless powershell -ep bypass -file C:\\ProgramData\\onedrive-sync.ps1'."
---
title: WMI permanent event subscription (fileless persistence)
id: 517559af-2a66-501a-8eaa-563edd9fcd80
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: [19, 20, 21]
  filter_scm:
    CommandLine|contains: 'SCM Event Log'
  condition: selection and not filter_scm
level: high
tags: [attack.persistence, attack.t1546.003]
x-sentinel:
  id: PERSIST-002
  severity: critical
  alert: [popup, toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  note: "Filter+Consumer+Binding = fileless. The only legit one on this box is 'SCM Event Log Filter/Consumer' — filtered above."
---
title: Persistence via Run-key / Winlogon / AppInit_DLLs / Userinit
id: d8e18883-9f73-5aa0-8645-72ae6c5b78a6
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 13
    TargetObject|contains: ['\CurrentVersion\Run', '\RunOnce', '\Winlogon', '\AppInit_DLLs', '\Userinit']
  filter_trustedinstaller_notify:
    # TrustedInstaller registering its Winlogon session notification during
    # Windows servicing (CreateSession event). Pure OS churn; fires on every
    # servicing pass. Scoped to the TrustedInstaller component path so a real
    # Winlogon\Notifications persistence entry by any other writer still fires.
    TargetObject|contains: '\Winlogon\Notifications\Components\TrustedInstaller'
  condition: selection and not filter_trustedinstaller_notify
level: high
tags: [attack.persistence, attack.t1060, attack.t1547.001]
x-sentinel:
  id: PERSIST-003
  severity: critical
  alert: [popup, toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
---
title: Executable/script written to Startup folder
id: e2fd1b0e-9740-5de6-a75a-79cf02366945
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\Start Menu\Programs\Startup'
    TargetFilename|re: '(?i)\.(exe|ps1|bat|cmd|vbs|js|lnk)$'
  condition: selection
level: high
tags: [attack.persistence, attack.t1547.001]
x-sentinel:
  id: PERSIST-004
  severity: critical
  alert: [popup, toast, log, eventlog]
