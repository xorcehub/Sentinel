title: New service with ImagePath in user-writable directory
id: 294ffc37-f4b3-5630-aaad-1025b458eadf
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 13
    TargetObject|contains: '\System\CurrentControlSet\Services'
  # These Services-subtree writes are device-state / perf-counter / start-type
  # churn, NOT a service ImagePath landing in a user-writable dir (the rule's
  # actual intent — the ImagePath-resolver engine_helper below is not yet
  # implemented). Dropping them keeps the rule focused on ImagePath persistence.
  filter_benign_subkeys:
    TargetObject|contains:
      - '\bam\State\UserSettings'      # Background Activity Moderator per-user tracking
      - '\vmsmp\parameters\NicList'    # Hyper-V virtual switch NIC list
      - '\vmsmp\parameters\SwitchList' # Hyper-V virtual switch vNIC FriendlyName (same churn family as NicList; svchost/kernel writers)
      - '\WmiApRpl\Performance'         # WMI perf-counter config
      - '\BTHPORT\Parameters'           # bluetooth paired-device FriendlyName
      - '\swenum\Devices'              # software device enumerator names
  filter_start_type:
    # A service's \Start DWORD (start-type) is never an ImagePath; the rule
    # targets ImagePath-in-writable-dir. Safe to drop start-type churn.
    TargetObject|endswith: '\Start'
  filter_admin_dir_imagepath:
    # services.exe registering OS/app services whose ImagePath points INTO an
    # admin-owned tree: WpnUserService_* per-user svchost services (every
    # logon), MSI Afterburner RTCore64, Edge elevation service. This is the
    # condition-level slice of the engine_helper below - the rule's target is
    # an ImagePath in a USER-WRITABLE dir, and planting into Windows/Program
    # Files already requires admin (out of this rule's threat model). Dropped
    # shapes, all end-anchored: (a) exactly c:\\windows\\system32\\svchost.exe,
    # optionally with one ' -k <group>' token (plus the svchost '-p'
    # protected flag — 2026-09-08: webthreatdefusersvc_* registers 'svchost
    # -k LocalSystemNetworkRestricted -p' per logon and the bare '-p' alone
    # escaped the old single-token shape); (b) \\\\?? kernel-driver paths under
    # windows\\system32 or Program Files, spaces allowed; (c) the same trees quoted.
    # Path bodies use a no-double-dot construction ((?:[^.]|.[^.])+), so ANY
    # '..' traversal (string says c:\\windows but resolves to Users\\Public) fails to
    # match; c:\\windows\\temp (Users-writable) is not in the trees. An ImagePath
    # with any other argument (cmd.exe /c style arg-injection), any traversal,
    # or pointing into AppData/Temp/ProgramData/Users/Public still fires.
    TargetObject|endswith: '\ImagePath'
    Details|re: '(?i)^(?:c:\\windows\\system32\\svchost\.exe(?: -k [a-z0-9]+)?(?: -p)?|\\\?\?\\c:\\(?:windows\\system32|program files(?: \(x86\))?)\\(?:[^\.]|\.[^\.])+\.(?:exe|sys|dll)|"c:\\(?:windows\\system32|program files(?: \(x86\))?)\\(?:[^\.]|\.[^\.])+\.(?:exe|sys|dll)")$'
  filter_credential_enrollment_usersvc:
    # 2026-11 tuning: 16/19 PERSIST-005 hits 10-07 -> 11-07. Windows mints a
    # per-user instance of CredentialEnrollmentManagerUserSvc (_<hex> LUID
    # suffix) at each logon and the SCM writes its ImagePath as the bare,
    # unquoted system32 binary — a shape filter_admin_dir_imagepath does not
    # cover (its unquoted arm is svchost-only). Scoped to this one service
    # family and this one exact ImagePath, no arguments (end-anchored, no
    # room for arg-injection). Kept narrow on purpose instead of widening the
    # generic unquoted arm.
    TargetObject|re: '(?i)\\services\\credentialenrollmentmanagerusersvc_[0-9a-f]+\\imagepath$'
    Details|re: '(?i)^c:\\windows\\system32\\credentialenrollmentmanager\.exe$'
  condition: selection and not filter_benign_subkeys and not filter_start_type and not filter_admin_dir_imagepath and not filter_credential_enrollment_usersvc
level: medium
tags: [attack.persistence, attack.t1543.003]
x-sentinel:
  id: PERSIST-005
  severity: suspicious
  alert: [toast, log, eventlog]
  engine_helper: "On hit, resolve service ImagePath from registry; mark suspicious only if it resolves to AppData/Temp/ProgramData/Users/Public (else drop). Partially implemented at condition level by filter_admin_dir_imagepath (admin-tree ImagePaths); the registry read would additionally catch user-writable ImagePaths only visible via the Services API."
  note: "Needs engine helper to read service ImagePath from registry on hit."
---
title: COM hijack - HKCU CLSID InprocServer32
id: 131fdd2d-3274-5701-95d7-30a624d60566
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 13
    TargetObject|contains: ['Classes\CLSID', 'InprocServer32']
  selection_user_hive:
    # engine_helper, implemented at condition level: the T1546.015 hijack
    # works by shadowing a machine CLSID from the USER hive
    # (HKU\<SID>\Software\Classes or HKU\<SID>_Classes;
    # \REGISTRY\A = app-key hives). Verified live 2026-09-01 with a
    # real hijack-shaped write: Sysmon renders it HKU\<SID>_Classes\... -
    # NOT HKCR (that spelling comes from admin-context writers).
    TargetObject|re: '(?i)^(?:hku|hkey_users|\\registry\\user|\\registry\\a)\\'
  selection_writable_payload:
    # Machine-hive registration (HKCR/HKLM = admin writer) stays ARMED when
    # the InprocServer32 payload itself sits in a user-writable tree: that is
    # the dangerous shape - weak-ACL CLSID abuse by a NON-admin, or an admin
    # staging a DLL a non-admin can swap later (SYSTEM loads it on COM
    # activation). Quiet only when the payload lives in admin-owned trees
    # (observed 51/51 churn: nahimic system32 DLL, Firefox AccessibleMarshal
    # in Program Files, DriverStore). Separator- and env-tolerant on purpose
    # (adversarial review 2026-09-01: 'C:/Users/Public/x.dll' and
    # '%PUBLIC%\\x.dll' evaded the backslash-only form; LoadLibrary accepts
    # forward slashes, REG_EXPAND_SZ delivers the raw %VAR% form). Caveat: a
    # machine-hive write whose Details Sysmon did not capture stays quiet
    # (Field-absent = no match).
    Details|re: '(?i)appdata|[/\\]temp[/\\]|programdata|[/\\]users[/\\]public|%temp%|%public%'
  condition: selection and (selection_user_hive or selection_writable_payload)
level: medium
tags: [attack.persistence, attack.t1546.015]
x-sentinel:
  id: PERSIST-006
  severity: suspicious
  alert: [toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  engine_helper: "Implemented at condition level: user-hive prefix (the T1546.015 form) OR a machine-hive registration whose payload sits in a user-writable tree. Machine-hive + admin-tree payload (admin-vs-admin) is out of scope; NOTE no other real-time rule sees CLSID writes (PERSIST-003/005 cover Run-keys/Services, not COM)."
