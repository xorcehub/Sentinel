# Sentinel catalog — Self-protection (03-RULES.md §8)
# Config tamper tripwire. Sentinel runs as the user; so does the malware — these
# files are user-writable. Detect (not prevent): raises the bar, leaves traces.

title: Sentinel config/state files written by a process other than sentinel.exe
id: 489aab76-cf21-5bfc-898e-477d6f680b89
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 11
    TargetFilename|contains: ['rules.d\', 'allowlist.json', 'baseline_clean.json', 'baseline_2', 'state.db', 'sentinel.conf']
  filter_sentinel:
    # 2026-09-02c redteam F11: was Image|endswith '\sentinel.exe' — name-trust
    # with no prefix anchor, so a binary RENAMED sentinel.exe in Downloads (or
    # anywhere) could write the real config silently (Sigma filter = not even
    # a suppressed line). Anchored to the deployed binary path
    # (scripts/install-task.ps1 launches <repo>\sentinel.exe).
    Image|re: '(?i)^[a-z]:\\[^\\]+\\documents\\github\\leave-my-shit-alone\\sentinel\.exe$'
  filter_temp:
    # Writes under Temp are test fixtures / staging copies, never the live
    # config dir. Real tamper targets rules.d/allowlist.json/state.db at the
    # install path (never Temp), so excluding Temp can't mask a real tamper.
    # Quiets go test exes (Temp/go-build*/.../state.db) and git cp into Temp.
    TargetFilename|contains: '\Temp\'
  condition: selection and not filter_sentinel and not filter_temp
level: high
tags: [attack.defense_evasion, attack.t1562.001]
x-sentinel:
  id: CONFIG-001
  severity: critical
  alert: [popup, toast, log, eventlog]
  engine_helper: "PLUS startup + periodic SHA256 of all config files (hashes in state.db): alert if a hash differs from last-known-good AND no corresponding EID 11 from sentinel.exe preceded it."
  note: "Detect config tampering (rule disabling / self-allowlisting). NOT a defense against a kernel/rootkit attacker (out of scope)."
