title: Process in Temp/AppData/ProgramData making outbound connection
id: 2b550738-741c-5213-9325-de0228569a8b
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 3
    Image|contains: ['Temp', 'AppData', 'ProgramData']
  condition: selection
level: high
tags: [attack.command_and_control]
x-sentinel:
  id: NET-004
  severity: critical
  alert: [popup, toast, log, eventlog]
  # image_in_dev_tools added with the Bypass-B interim reclassification: the
  # per-user dev tools (Cursor/vscode/python/claude, in AppData) were moved
  # from trusted_binaries to dev_tool_paths because user-writable path-trust
  # let a planted mimic suppress this rule. NET-004 keys on Image|contains
  # AppData, which fires on every legit Cursor outbound, so without this except
  # the move would toast-flood. NET-005 (loopback C2) has no image except and
  # stays armed - but only once the 2026-09-01 X1/X2 fixes are DEPLOYED
  # (docs/found_noise.md: NET-005 was source-blind to 127.0.0.1 and regex-blind
  # to Sysmon's expanded 0:0:0:0:0:0:0:1 form for its entire life before that).
  except:
    image_in_allowlist: trusted_binaries
    image_in_dev_tools: dev_tool_paths
---
title: Loopback connection to non-baseline listener (broker driver channel)
id: 785787a7-8a92-5364-a31c-09af26b4c43a
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 3
    # 0:0:0:0:0:0:0:1 = Sysmon's EXPANDED rendering of ::1 (observed live
    # 2026-09-01: an ::1 connect arrived as 0:0:0:0:0:0:0:1 and missed the
    # old '^(127\.|::1)' anchor entirely).
    DestinationIp|re: '^(127\.|::1|0:0:0:0:0:0:0:1)'
  condition: selection
level: high
tags: [attack.command_and_control, attack.t1571]
x-sentinel:
  id: NET-005
  severity: critical
  dedup: 5m
  target_key: "{{.ID}}|{{.Image}}|{{.DstIP}}:{{.DstPort}}"
  alert: [popup, toast, log, eventlog]
  except:
    dst_in_allowlist: known_loopback_listeners
  note: "THE gap-closer. Driver POSTs commands to broker at 127.0.0.1:<high port> over loopback. NET-001 catches the listener; this catches traffic to it."
