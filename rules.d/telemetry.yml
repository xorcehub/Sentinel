status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 16
  condition: selection
level: medium
tags: [attack.defense_evasion, attack.t1562.001]
x-sentinel:
  id: TELEMETRY-001
  severity: suspicious
  dedup: 24h
  alert: [toast, log, eventlog]
