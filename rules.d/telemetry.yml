title: Sysmon log cleared (System EID 104) or channel RecordIds rewound
id: 3c9b2e71-5d0a-4f8e-9b16-7a4e2d81c5f0
status: experimental
logsource: { product: sentinel-telemetry }
detection:
  selection:
    Source: sentinel
    Details|startswith:
      - 'sysmon-log-cleared'
      - 'sysmon-recordid-rewound'
  condition: selection
level: critical
tags: [attack.defense_evasion, attack.t1070.001]
x-sentinel:
  id: TELEMETRY-002
  severity: critical
  # Details carries the System RecordId of the clear (or the rewind numbers),
  # so each clear is its own dedup key. 25h > the poller's 24h look-back: a
  # daemon restart re-reads recent clears, and the persisted dedup keeps an
  # already-alerted clear from firing again.
  target_key: "{{.ID}}|{{.Details}}"
  dedup: 25h
  note: "Synthetic events from the Sysmon poller (internal/ingest/logclear.go, sysmon_rt_windows.go). Main signal: System log EID 104 (Microsoft-Windows-Eventlog, 'log file was cleared') naming the Sysmon channel, i.e. wevtutil cl / Clear-EventLog / Event Viewer 'Clear Log' on Microsoft-Windows-Sysmon/Operational, a classic anti-forensics step. Details names the clearing account and the backup path. Read with a 24h look-back, so clears made while Sentinel was stopped also alert at the next start. A clear does NOT restart RecordIds (measured 2026-11-07), so ingestion is unaffected; history before the clear is gone from the live log (only in the backup file, if one was made). Fallback signal: the channel's newest RecordId fell below the consumed high-water (channel recreated); the poller then resets and re-reads."
