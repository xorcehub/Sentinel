title: Nahimic DataSystemCOM re-registration
x-sentinel-overlay:
  rule: PERSIST-006
detection:
  filter_nahimic_datasystem:
    # 2026-11 tuning: 18/18 PERSIST-006 hits 10-07 -> 11-07 were ONE tuple —
    # the system32 Nahimic service re-registering its own DataSystemCOM.dll
    # under ProgramData on every start. ProgramData trips the writable-payload
    # arm, but this tree's ACL was checked on the box: Users have (OI)(CI)(RX)
    # only on ...\Modules\Regular\x64 and the DLL (no WD/AD, so no swap and no
    # new-file plant). ALL APPLICATION PACKAGES:F is not a hole: AppContainer
    # access is intersected with the user's own (RX). Exact tuple only: writer
    # pinned to the admin-owned system32 image, the machine-hive key to this
    # CLSID, the payload to this exact path. Any other writer, CLSID, hive, or
    # payload path (including a re-point of this CLSID elsewhere) still fires.
    Image|re: '(?i)^c:\\windows\\system32\\nahimicservice\.exe$'
    TargetObject|re: '(?i)^hkcr\\clsid\\\{1fc71449-acec-420d-a3e9-7a0fc630926e\}\\inprocserver32\\\(default\)$'
    Details|re: '(?i)^c:\\programdata\\a-volute\\a-volute\.nahimic\\modules\\regular\\x64\\datasystemcom\.dll$'
  condition: filter_nahimic_datasystem
