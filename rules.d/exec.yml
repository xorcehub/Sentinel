title: LOLBin reaching network or running script/http
id: d609881b-3a8b-5537-9cb0-3c7168a54aa2
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection_image:
    EventID: 1
    Image|endswith: ['\mshta.exe','\certutil.exe','\bitsadmin.exe','\msiexec.exe','\regsvr32.exe','\rundll32.exe','\wscript.exe','\cscript.exe','\forfiles.exe','\msdt.exe','\dpi.exe']
  selection_cli:
    CommandLine|contains: ['http://', 'https://', '.ps1', '.bat', '.vbs', 'script', 'url']
  filter_bare_image:
    # Sysmon sometimes reports the bare image name as the entire command line
    # (observed: Docker Desktop's cscript helper, CmdLine == "cscript.exe"). The
    # hit is then just the keyword 'script' matching inside the IMAGE NAME — a
    # broker launched with no arguments carries no script/http payload, so
    # there is nothing to detect. Any real argument (path, URL, token) keeps
    # selection_cli armed. Covers bare-name and full-path bare invocations.
    CommandLine|re: '(?i)^\s*"?(?:[a-z]:\\[^\s]*\\)?(?:cscript|wscript)\.exe"?\s*$'
  condition: selection_image and selection_cli and not filter_bare_image
level: medium
tags: [attack.execution, attack.t1218]
x-sentinel:
  id: EXEC-003
  severity: suspicious
  alert: [toast, log, eventlog]
  except: { cmdline_in_dev_scripts: dev_scripts }
  note: "Paired with http/script to reduce noise. dev_scripts quiets known LOLBin-driven dev helpers (e.g. Docker Desktop's cscript regList.wsf) without trusting the LOLBin image."
---
title: Executable with random/hex/GUID name from Temp/AppData/ProgramData
id: 59932e07-ceb1-5d19-a589-22e58ee51443
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 1
    # 2026-09-02c redteam F13: Users\Public added — world-writable tree, same
    # gap F8a closed in NET-004; a hex-named exe dropped in Public was silent.
    Image|re: '(?i)(Temp|AppData|ProgramData|Users\\Public).*(\\|/)([0-9a-f]{6,}|[0-9a-f]{8}-[0-9a-f]{4})\.exe$'
  condition: selection
level: medium
tags: [attack.execution, attack.t1027]
x-sentinel:
  id: EXEC-004
  severity: suspicious
  alert: [toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  note: "FP on installer self-extraction (Inno 'is-*.tmp', Defender {GUID}); allowlist those path patterns."
---
title: Child script/exe spawned from Office / PDF reader / browser
id: a99b1cfa-6576-56ff-8b14-9bddeef82d21
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection_child:
    EventID: 1
    Image|endswith: ['\cmd.exe','\powershell.exe','\wscript.exe','\cscript.exe','\mshta.exe','\rundll32.exe']
  selection_parent:
    ParentImage|endswith: ['\winword.exe','\excel.exe','\powerpnt.exe','\outlook.exe','\acrord32.exe','\reader.exe','\msedge.exe','\firefox.exe','\chrome.exe']
  condition: selection_child and selection_parent
level: medium
tags: [attack.execution, attack.t1204, attack.t1566]
x-sentinel:
  id: EXEC-005
  severity: suspicious
  alert: [toast, log, eventlog]
