title: Process touching amsi.dll / System.dll via Reflection (AMSI patching)
id: 5bad55f1-f250-5008-8c04-f19aaca1225c
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: [1, 7]
    CommandLine|contains: ['amsi','AmsiUtils','GetAssemblies','System.dll','GlobalAssemblyCache']
  condition: selection
level: high
tags: [attack.defense_evasion, attack.t1562.002]
x-sentinel:
  id: EVADE-001
  severity: critical
  alert: [popup, toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  note: "The AMSI-bypass that named this family 'MaleficAms'."
