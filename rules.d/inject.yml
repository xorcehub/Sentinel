# Sentinel catalog — Injection / defense evasion (03-RULES.md §E)

title: CreateRemoteThread into a foreign process
id: b4bdd625-7ac6-5880-9d68-21c9b5e8f4c9
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 8
  condition: selection
level: high
tags: [attack.privilege_escalation, attack.t1055]
x-sentinel:
  id: INJECT-001
  severity: critical
  alert: [popup, toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  note: "Any EID 8 is suspicious unless both source+target are allowlisted."
---
title: Unsigned or user-writable-path DLL loaded
id: 1b484fd8-84ee-53bc-b4ea-12215c9041fa
status: experimental
logsource: { product: windows, service: sysmon }
detection:
  selection:
    EventID: 7
    ImageLoaded|re: '(?i)(Temp|AppData|ProgramData|Downloads).*\.dll$'
    Signed: 'false'
  condition: selection
level: medium
tags: [attack.privilege_escalation, attack.t1055.001]
x-sentinel:
  id: INJECT-002
  severity: suspicious
  alert: [toast, log, eventlog]
  except: { image_in_allowlist: trusted_binaries }
  note: "EID 7: Image = loader; ImageLoaded = the DLL. Match on ImageLoaded + module's Signed (NOT the process signature)."
